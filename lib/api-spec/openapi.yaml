components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    # ─── AUTH SCHEMAS ──────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password, companyName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        companyName:
          type: string
        phone:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, staff]
        phone:
          type: string
          nullable: true
        isActive:
          type: boolean
        company:
          $ref: "#/components/schemas/Company"
      required: [id, companyId, firstName, lastName, email, role, isActive]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        token:
          type: string
      required: [user, token]

    # ─── COMPANY SCHEMAS ───────────────────────────────────────────────────────
    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: string
          nullable: true
        primaryColor:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        subscriptionPlan:
          type: string
          enum: [starter, growth, pro]
          nullable: true
        subscriptionStatus:
          type: string
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        reviewUrl:
          type: string
          nullable: true
        internalNotes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, slug, createdAt]

    UpdateSettingsRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        website:
          type: string
        timezone:
          type: string
        primaryColor:
          type: string
        reviewUrl:
          type: string

    # ─── DASHBOARD ─────────────────────────────────────────────────────────────
    DashboardData:
      type: object
      properties:
        todayAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        upcomingAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        recentCustomers:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        revenueThisMonth:
          type: number
        unpaidInvoicesCount:
          type: integer
        unpaidInvoicesTotal:
          type: number
        recurringJobsCount:
          type: integer
        totalCustomers:
          type: integer
        pendingReviewRequests:
          type: integer
      required: [todayAppointments, upcomingAppointments, recentCustomers, revenueThisMonth, unpaidInvoicesCount, unpaidInvoicesTotal, recurringJobsCount, totalCustomers, pendingReviewRequests]

    # ─── CUSTOMER SCHEMAS ──────────────────────────────────────────────────────
    Customer:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        leadSource:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, companyId, firstName, lastName, createdAt]

    CustomerDetail:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/Customer"
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"
        recentAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        recentInvoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
      required: [customer, properties, recentAppointments, recentInvoices]

    CustomerListResponse:
      type: object
      properties:
        customers:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [customers, total, page, limit]

    CreateCustomerRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        notes:
          type: string
        leadSource:
          type: string
        tags:
          type: array
          items:
            type: string

    # ─── PROPERTY SCHEMAS ──────────────────────────────────────────────────────
    Property:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        customerId:
          type: integer
        propertyName:
          type: string
          nullable: true
        addressLine1:
          type: string
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        gateNotes:
          type: string
          nullable: true
        yardSize:
          type: string
          nullable: true
        propertyNotes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, companyId, customerId, addressLine1, createdAt]

    PropertyListResponse:
      type: object
      properties:
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [properties, total, page, limit]

    CreatePropertyRequest:
      type: object
      required: [customerId, addressLine1]
      properties:
        customerId:
          type: integer
        propertyName:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        gateNotes:
          type: string
        yardSize:
          type: string
        propertyNotes:
          type: string

    # ─── SERVICE SCHEMAS ───────────────────────────────────────────────────────
    Service:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        basePrice:
          type: number
          nullable: true
        isActive:
          type: boolean
        category:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, companyId, name, isActive, createdAt]

    ServiceListResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
      required: [services]

    CreateServiceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        basePrice:
          type: number
        isActive:
          type: boolean
        category:
          type: string

    # ─── APPOINTMENT SCHEMAS ───────────────────────────────────────────────────
    Appointment:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        customerId:
          type: integer
        propertyId:
          type: integer
          nullable: true
        serviceId:
          type: integer
          nullable: true
        assignedUserId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled, no_show]
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
          nullable: true
        price:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        internalNotes:
          type: string
          nullable: true
        completionNotes:
          type: string
          nullable: true
        reminderSent:
          type: boolean
        customerName:
          type: string
          nullable: true
        serviceName:
          type: string
          nullable: true
        assignedUserName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, companyId, customerId, status, scheduledStart, reminderSent, createdAt]

    AppointmentDetail:
      type: object
      properties:
        appointment:
          $ref: "#/components/schemas/Appointment"
        customer:
          $ref: "#/components/schemas/Customer"
        property:
          $ref: "#/components/schemas/Property"
        service:
          $ref: "#/components/schemas/Service"
      required: [appointment, customer]

    AppointmentListResponse:
      type: object
      properties:
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [appointments, total, page, limit]

    CreateAppointmentRequest:
      type: object
      required: [customerId, scheduledStart, status]
      properties:
        customerId:
          type: integer
        propertyId:
          type: integer
        serviceId:
          type: integer
        assignedUserId:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled, no_show]
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
