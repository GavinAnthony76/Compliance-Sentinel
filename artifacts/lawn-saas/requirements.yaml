  "recharts": "Analytics charts for the dashboard"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility to cleanly merge Tailwind classes in components"
  "react-hook-form": "Managing complex forms for registration and entity creation"
