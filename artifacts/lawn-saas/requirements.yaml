notes:
  - Assuming the `customFetch` used by generated api-client-react automatically reads auth tokens from localStorage, or we will globally patch fetch in App.tsx to ensure Authorization headers are sent to /api endpoints.
  - Using wouter for routing.
  - Using Lucide React for all iconography.
