    description: "Beautiful, sunny, perfectly manicured suburban lawn with modern house in background, soft morning light, highly professional and aspirational, clean composition, lots of negative space for text overlays"
    aspect_ratio: "16:9"
  - path: "artifacts/lawn-saas/public/images/logo-icon.png"
    description: "Minimalist modern tech logo mark featuring a stylized geometric leaf or grass blade in vibrant emerald green, transparent background, solid flat colors"
