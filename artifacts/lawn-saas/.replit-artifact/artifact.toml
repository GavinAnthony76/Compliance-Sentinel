kind = "web"
previewPath = "/"
title = "GreenSynk Lawn Care Management"
version = "1.0.0"
id = "artifacts/lawn-saas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26093

[services.development]
run = "pnpm --filter @workspace/lawn-saas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lawn-saas", "run", "build" ]

[services.production.run]
args = ["node", "artifacts/lawn-saas/ssr-server.mjs"]

[services.env]
PORT = "26093"
BASE_PATH = "/"
API_PORT = "8080"
