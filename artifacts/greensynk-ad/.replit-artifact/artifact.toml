kind = "video"
previewPath = "/greensynk-ad/"
title = "GreenSynk Ad"
version = "1.0.0"
id = "artifacts/greensynk-ad"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/greensynk-ad/" ]
localPort = 23872

[services.development]
run = "pnpm --filter @workspace/greensynk-ad run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/greensynk-ad", "run", "build" ]
publicDir = "artifacts/greensynk-ad/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23872"
BASE_PATH = "/greensynk-ad/"
